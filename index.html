<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>COVID-19 Early Outbreak Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body class="bg-gray-100 text-gray-900 min-h-screen p-6">
    <div class="max-w-7xl mx-auto space-y-6">
      <!-- Header -->
      <header class="text-center py-4 bg-white rounded-lg shadow-sm">
        <h1 class="text-3xl font-bold text-blue-900">
          COVID-19 Early Outbreak Tracker
        </h1>
        <p class="text-gray-600">Johns Hopkins University Dataset Analysis</p>
      </header>

      <!-- Controls & Country Selector -->
      <div
        class="flex flex-col sm:flex-row justify-between items-center bg-white p-4 rounded-lg shadow-sm gap-4"
      >
        <label for="countrySelect" class="font-semibold text-gray-700"
          >Select Country:</label
        >
        <select
          id="countrySelect"
          class="w-full sm:w-64 p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
          <option value="All">All Countries</option>
        </select>
      </div>

      <!-- KPI Summary Cards -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div
          class="bg-white p-6 rounded-lg shadow-sm border-l-4 border-blue-500"
        >
          <h3 class="text-sm font-medium text-gray-500 uppercase">
            Total Confirmed
          </h3>
          <p id="totalConfirmed" class="text-3xl font-bold text-blue-600 mt-2">
            0
          </p>
        </div>
        <div
          class="bg-white p-6 rounded-lg shadow-sm border-l-4 border-green-500"
        >
          <h3 class="text-sm font-medium text-gray-500 uppercase">
            Total Recovered
          </h3>
          <p id="totalRecovered" class="text-3xl font-bold text-green-600 mt-2">
            0
          </p>
        </div>
        <div
          class="bg-white p-6 rounded-lg shadow-sm border-l-4 border-red-500"
        >
          <h3 class="text-sm font-medium text-gray-500 uppercase">
            Total Deaths
          </h3>
          <p id="totalDeaths" class="text-3xl font-bold text-red-600 mt-2">0</p>
        </div>
      </div>

      <!-- Line Chart Container -->
      <main class="bg-white p-6 rounded-lg shadow-sm">
        <h2 id="chartTitle" class="text-xl font-semibold mb-4 text-gray-800">
          Confirmed Cases Over Time
        </h2>
        <div class="relative w-full h-[400px]">
          <canvas id="casesChart"></canvas>
        </div>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
